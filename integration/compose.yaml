name: wlw-native-single-case

x-common: &common
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  network_mode: none
  shm_size: "8gb"
  volumes:
    - ../../reference:/reference:ro
    - ../../run:/run

services:
  report-decompose:
    <<: *common
    image: wlw/person-a:lab22-integrated
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile
    command:
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/case_input.json
      - --output
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/D_dx_pairs.json
      - --config
      - /app/components/person_a/configs/report_decompose.default.json

  interest-pattern:
    <<: *common
    image: wlw/person-c:0.4.0-final-20261027
    gpus: all
    build:
      context: ..
      dockerfile: components/person_c/Dockerfile
    command:
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/case_input.json
      - --output
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/E_rois.json
      - --config
      - /app/components/person_c/configs/default.json

  knowledge-retrieval:
    <<: *common
    image: wlw/person-b:final-main-42ce738
    gpus: all
    build:
      context: ..
      dockerfile: components/person_b/Dockerfile
    depends_on:
      report-decompose:
        condition: service_completed_successfully
    command:
      - --input
      - /run/input/pipeline/A_literature.json
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/D_dx_pairs.json
      - --output
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/F_chunks.json
      - --config
      - /app/components/person_b/configs/dense.default.json

  query-generation:
    <<: *common
    image: wlw/person-a:lab22-integrated
    gpus: all
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile
    entrypoint: ["python", "-m", "components.person_a.query_generation"]
    depends_on:
      knowledge-retrieval:
        condition: service_completed_successfully
    command:
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/D_dx_pairs.json
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/F_chunks.json
      - --output
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/G_queries.json
      - --config
      - /app/components/person_a/configs/query_generation.default.json

  visual-filter:
    <<: *common
    image: wlw/person-d:lab22-integrated
    gpus: all
    build:
      context: ..
      dockerfile: components/person_d/Dockerfile
    depends_on:
      interest-pattern:
        condition: service_completed_successfully
      query-generation:
        condition: service_completed_successfully
    command:
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/E_rois.json
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/G_queries.json
      - --output
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/H_matches.json
      - --config
      - /app/components/person_d/configs/native.example.json

  clee:
    <<: *common
    image: wlw/person-e:final-main-42ce738
    gpus: all
    build:
      context: ..
      dockerfile: components/person_e/Dockerfile
    depends_on:
      report-decompose:
        condition: service_completed_successfully
      visual-filter:
        condition: service_completed_successfully
    command:
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/D_dx_pairs.json
      - --input
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/H_matches.json
      - --output
      - /run/output/pipeline/cases/${CASE_ID:-S1202317}/I_selected_rois.json
      - --config
      - /app/components/person_e/configs/native.json
